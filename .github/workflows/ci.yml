name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: |
          deno check supabase/functions/mpesa-stk/index.ts
          deno check supabase/functions/mpesa-status/index.ts
          deno check supabase/functions/mobiwave-send/index.ts
          deno check supabase/functions/mobiwave-status/index.ts
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
